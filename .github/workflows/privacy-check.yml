name: Privacy check

# Fails the build if any tracked file matches the personal-data blocklist.
#
# The blocklist is itself personal data (phone, employers, recruiters'
# names), so it isn't in the repo: it comes from the PRIVACY_PATTERNS
# repository secret — one regex per line, '#' comments allowed. Keep the same
# list locally in .privacy-patterns.local (gitignored) for `make privacy-check`,
# and update the secret with:
#   gh secret set PRIVACY_PATTERNS < .privacy-patterns.local
# Without the secret the check fails rather than passing silently.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Scan for personal-data leaks
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: |
          if [ -z "$PRIVACY_PATTERNS" ]; then
            echo "::error::PRIVACY_PATTERNS secret is not set — nothing to scan against. Set it with: gh secret set PRIVACY_PATTERNS < .privacy-patterns.local"
            exit 1
          fi
          PATTERN=$(printf '%s\n' "$PRIVACY_PATTERNS" | grep -vE '^\s*(#|$)' | paste -sd'|' -)
          # Scans everything tracked, .github/ and CONTRIBUTING.md included —
          # the blocklist no longer lives in them. *.mp4 is skipped: binary
          # bytes can coincidentally match short patterns.
          if rg -i -e "$PATTERN" --glob='!*.mp4' . ; then
            echo ""
            echo "::error::Privacy scan found matches above. Remove the personal data before merging."
            exit 1
          else
            echo "Privacy scan clean — no blocklist matches."
          fi
