name: harness-checks

# Deterministic layer of the test harness: schema validator unit tests,
# snapshot conformance, golden-set label arithmetic, calibration stats, and the
# plugin/scripts/ tests (follow-ups, archive, CV build, ATS check).
# pytest + the scripts' own requirements and the Carlito font, so the PDF tests
# run here instead of skipping — no API keys, no LLM calls, $0.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest and script dependencies
        run: pip install pytest -r plugin/scripts/requirements.txt
      - name: Install the Carlito font (cv-build.py)
        run: sudo apt-get update && sudo apt-get install -y fonts-crosextra-carlito
      - name: Run root test suite
        run: python3 -m pytest tests/ -v
