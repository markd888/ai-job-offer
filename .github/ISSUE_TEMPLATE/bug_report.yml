name: Bug report
description: A skill or script did something wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This tracker is **public**. Leave out your CV, profile, company names, people and contacts.
        Describe the problem with made-up examples instead. Security issue? Use
        [private reporting](https://github.com/markd888/ai-job-offer/security/advisories/new), not an issue.
  - type: input
    id: skill
    attributes:
      label: Skill or script
      placeholder: /job-offer:ats-check, scripts/score.py, the dashboard…
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: From `/plugin` in Claude Code, or `claude plugin list`.
      placeholder: "0.8.7"
    validations:
      required: true
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code version
      description: "`claude --version`"
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Error text or output helps. Remove personal data from it first.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed my CV, profile, company names, people and contacts from this report.
          required: true
